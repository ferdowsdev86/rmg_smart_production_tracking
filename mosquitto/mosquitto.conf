# Mosquitto broker for SmartFinishingFloor IoT devices (LAN).
# Plain MQTT for devices + WebSocket listener for browsers.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# LAN-internal broker: anonymous clients allowed (add password_file later
# if devices should authenticate).
allow_anonymous true

# MQTT (IoT devices / backend)
listener 1883
protocol mqtt

# MQTT over WebSockets (browser clients)
listener 9001
protocol websockets
